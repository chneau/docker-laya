name: Publish Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laya

jobs:
  # Fast, no torch and no Docker: lockfile, lint, and OpenAPI schema.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check lockfile
        run: uv lock --check

      - name: Lint and format check
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Validate OpenAPI schema
        run: |
          uv run --no-project --with 'fastapi>=0.115' --with 'pydantic>=2' --with 'python-dotenv>=1.2' python -c "import sys; sys.path.insert(0, '.'); from app.main import app; s = app.openapi(); assert '/v1/systemone' in s['paths'] and '/predict' in s['paths']; print('openapi ok:', list(s['paths']))"

  # Unit and HTTP contract tests plus static typing. Torch is not needed because
  # the tests substitute the Laya boundary.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev --no-install-package torch

      - name: Tests
        run: uv run --no-sync pytest

      - name: Static checks
        run: |
          uv run --no-sync mypy
          uv run --no-sync pyright

  # Pull requests: build the image once and check it boots.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: laya-api:test
          cache-from: type=gha,scope=amd64-default

      - name: Container smoke test
        run: |
          docker run --rm --entrypoint python laya-api:test -c "from app.main import app; s = app.openapi(); assert '/v1/systemone' in s['paths'] and '/predict' in s['paths']; print('container ok')"

  # Pull requests: build the CUDA image once and check it boots. No GPU is needed
  # to build; only to run it.
  cuda:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: laya-api:cuda-test
          build-args: |
            TORCH_INDEX=https://download.pytorch.org/whl/cu126
            TORCH_DISABLE_NATIVE_JIT=1
          cache-from: type=gha,scope=amd64-cuda-default

      - name: Container smoke test
        run: |
          docker run --rm --entrypoint python laya-api:cuda-test -c "from app.main import app; s = app.openapi(); assert '/v1/systemone' in s['paths'] and '/predict' in s['paths']; print('cuda container ok')"

  # Nightly / manual / release: real model download + inference.
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with baked english model
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: laya-api:smoke
          build-args: |
            PRELOAD_MODEL=1
            MODELS=english
          cache-from: type=gha,scope=amd64-english

      - name: Full inference smoke test
        run: |
          docker run -d --name laya-api -p 8000:8000 -e API_KEYS=test laya-api:smoke
          for i in $(seq 1 150); do
            if curl -sf http://localhost:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/healthz
          curl -sf -X POST http://localhost:8000/predict \
            -H 'X-API-Key: test' -H 'Content-Type: application/json' \
            -d '{"state":"I was billed twice. Please refund.","questions":{"refund":{"type":"noul","instructions":"Does the customer ask for money back?"}}}'
          curl -sf -X POST http://localhost:8000/v1/systemone \
            -H 'X-API-Key: test' -H 'Content-Type: application/json' \
            -d '{"state":"I was billed twice. Please refund.","model":"laya-english","questions":{"refund":{"type":"noul","instructions":"Does the customer ask for money back?"}}}'
          docker logs laya-api
          docker rm -f laya-api

  # Build each platform and model variant natively (no QEMU) and push by digest.
  build:
    needs: [lint, checks]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.platform_info.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform_info:
          - platform: linux/amd64
            runner: ubuntu-latest
            scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: arm64
        variant:
          - name: default
            preload: "0"
            models: "english"
          - name: english
            preload: "1"
            models: "english"
          - name: multilingual
            preload: "1"
            models: "multilingual"
          - name: typed-decisions
            preload: "1"
            models: "typed-decisions"
          - name: all
            preload: "1"
            models: "english,multilingual,typed-decisions"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform_info.platform }}
          build-args: |
            PRELOAD_MODEL=${{ matrix.variant.preload }}
            MODELS=${{ matrix.variant.models }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform_info.scope }}-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_info.scope }}-${{ matrix.variant.name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.platform_info.scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # CUDA variants, linux/amd64 only: PyTorch's CUDA wheels are x86_64.
  # Published on branch/tag pushes and manual runs, but not on the nightly schedule
  # (the CUDA wheels do not change nightly, and each build downloads ~2.5 GB).
  build-cuda:
    needs: [lint, checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            preload: "0"
            models: "english"
          - name: english
            preload: "1"
            models: "english"
          - name: multilingual
            preload: "1"
            models: "multilingual"
          - name: typed-decisions
            preload: "1"
            models: "typed-decisions"
          - name: all
            preload: "1"
            models: "english,multilingual,typed-decisions"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            TORCH_INDEX=https://download.pytorch.org/whl/cu126
            TORCH_DISABLE_NATIVE_JIT=1
            PRELOAD_MODEL=${{ matrix.variant.preload }}
            MODELS=${{ matrix.variant.models }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64-cuda-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=amd64-cuda-${{ matrix.variant.name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-cuda-${{ matrix.variant.name }}-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine per-platform digests into multi-arch manifest lists for each variant.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
          - name: english
          - name: multilingual
          - name: typed-decisions
          - name: all
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant.name == 'default' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ matrix.variant.name == 'default' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ matrix.variant.name }},enable=${{ matrix.variant.name != 'default' }}
            type=ref,event=branch,suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

  # Combine the CUDA digests into single-platform manifest lists for each variant.
  merge-cuda:
    needs: build-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
          - name: english
          - name: multilingual
          - name: typed-decisions
          - name: all
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-cuda-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=cuda,enable=${{ matrix.variant.name == 'default' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=cuda,enable=${{ matrix.variant.name == 'default' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ matrix.variant.name }}-cuda,enable=${{ matrix.variant.name != 'default' }}
            type=ref,event=branch,suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}-cuda
            type=semver,pattern={{version}},suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}-cuda
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.name != 'default' && format('-{0}', matrix.variant.name) || '' }}-cuda

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
