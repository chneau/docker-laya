[project]
name = "laya-api"
version = "0.1.0"
description = "Dockerized Laya prediction API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "laya>=0.4.6",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "D"]
ignore = [
    "B008", # FastAPI Depends()/Header() in defaults is intentional
    "D105", # magic methods document themselves
    "D107", # __init__ is described by the class docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"
